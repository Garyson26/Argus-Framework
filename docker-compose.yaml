version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: fufufafa-postgres
    environment:
      POSTGRES_USER: fufufafa
      POSTGRES_PASSWORD: fufufafa_secret
      POSTGRES_DB: fufufafa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fufufafa"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: fufufafa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5-community
    container_name: fufufafa-neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4j_secret
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # FuFuFaFa Application
  fufufafa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fufufafa-app
    environment:
      FUFUFAFA_POSTGRES_HOST: postgres
      FUFUFAFA_POSTGRES_PORT: 5432
      FUFUFAFA_POSTGRES_USER: fufufafa
      FUFUFAFA_POSTGRES_PASSWORD: fufufafa_secret
      FUFUFAFA_POSTGRES_DB: fufufafa
      FUFUFAFA_REDIS_HOST: redis
      FUFUFAFA_REDIS_PORT: 6379
      FUFUFAFA_NEO4J_URI: bolt://neo4j:7687
      FUFUFAFA_NEO4J_USER: neo4j
      FUFUFAFA_NEO4J_PASSWORD: neo4j_secret
      FUFUFAFA_DEBUG: "false"
    volumes:
      - ./reports:/app/reports
      - ~/.aws:/root/.aws:ro  # Mount AWS credentials
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fufufafa-worker
    command: celery -A src.worker.tasks worker --loglevel=info
    environment:
      FUFUFAFA_POSTGRES_HOST: postgres
      FUFUFAFA_POSTGRES_PORT: 5432
      FUFUFAFA_POSTGRES_USER: fufufafa
      FUFUFAFA_POSTGRES_PASSWORD: fufufafa_secret
      FUFUFAFA_POSTGRES_DB: fufufafa
      FUFUFAFA_REDIS_HOST: redis
      FUFUFAFA_REDIS_PORT: 6379
      FUFUFAFA_NEO4J_URI: bolt://neo4j:7687
      FUFUFAFA_NEO4J_USER: neo4j
      FUFUFAFA_NEO4J_PASSWORD: neo4j_secret
    volumes:
      - ~/.aws:/root/.aws:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
