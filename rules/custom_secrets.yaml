# Custom Secret Detection Rules for Argus
#
# This file contains additional secret detection patterns beyond the default set.
# Add your organization-specific patterns here.
#
# Rule Format:
#   - id: Unique identifier (e.g., CUSTOM-001)
#   - name: Human-readable name
#   - pattern: Regex pattern (Python regex syntax)
#   - severity: critical, high, medium, low, info
#   - description: What this rule detects
#   - suggestion: Remediation advice
#   - file_patterns: List of glob patterns (optional, default: ["*"])
#   - exclude_patterns: List of glob patterns to exclude (optional)
#   - keywords: Pre-filter keywords for performance (optional)
#   - confidence: 0.0-1.0 (optional, default: 0.9)
#   - enabled: true/false (optional, default: true)

rules:
  # =========================================================================
  # CLOUD PROVIDER SECRETS
  # =========================================================================
  
  - id: CUSTOM-GCP-SERVICE-ACCOUNT
    name: GCP Service Account Key
    pattern: '(?i)("type"\s*:\s*"service_account"[^}]*"private_key"\s*:\s*"-----BEGIN'
    severity: critical
    description: Detects GCP service account JSON key files
    suggestion: Use Workload Identity Federation instead of service account keys
    file_patterns: ["*.json"]
    keywords: ["service_account", "private_key"]
    confidence: 0.95

  - id: CUSTOM-AZURE-CONNECTION-STRING
    name: Azure Storage Connection String
    pattern: 'DefaultEndpointsProtocol=https?;AccountName=[^;]+;AccountKey=[A-Za-z0-9+/=]{88}'
    severity: critical
    description: Detects Azure Storage connection strings with account keys
    suggestion: Use Azure AD authentication or managed identities instead
    keywords: ["DefaultEndpointsProtocol", "AccountKey"]
    confidence: 0.95

  - id: CUSTOM-AZURE-SAS-TOKEN
    name: Azure SAS Token
    pattern: '(?i)[?&]sig=[A-Za-z0-9%]{32,}'
    severity: high
    description: Detects Azure Shared Access Signature tokens in URLs
    suggestion: Use short-lived SAS tokens and rotate regularly
    keywords: ["sig="]
    confidence: 0.85

  # =========================================================================
  # DATABASE CREDENTIALS
  # =========================================================================
  
  - id: CUSTOM-MONGO-URI
    name: MongoDB Connection URI
    pattern: 'mongodb(\+srv)?://[^:]+:[^@]+@[^\s]+'
    severity: critical
    description: Detects MongoDB connection strings with embedded credentials
    suggestion: Use environment variables or secrets manager for database credentials
    keywords: ["mongodb://", "mongodb+srv://"]
    confidence: 0.95

  - id: CUSTOM-POSTGRES-URI
    name: PostgreSQL Connection URI
    pattern: 'postgres(ql)?://[^:]+:[^@]+@[^\s]+'
    severity: critical
    description: Detects PostgreSQL connection strings with embedded credentials
    suggestion: Use environment variables or secrets manager for database credentials
    keywords: ["postgres://", "postgresql://"]
    confidence: 0.95

  - id: CUSTOM-MYSQL-URI
    name: MySQL Connection URI
    pattern: 'mysql://[^:]+:[^@]+@[^\s]+'
    severity: critical
    description: Detects MySQL connection strings with embedded credentials
    suggestion: Use environment variables or secrets manager for database credentials
    keywords: ["mysql://"]
    confidence: 0.95

  - id: CUSTOM-REDIS-URI
    name: Redis Connection URI
    pattern: 'redis://[^:]*:[^@]+@[^\s]+'
    severity: high
    description: Detects Redis connection strings with embedded passwords
    suggestion: Use environment variables for Redis authentication
    keywords: ["redis://"]
    confidence: 0.90

  # =========================================================================
  # FRAMEWORK-SPECIFIC SECRETS
  # =========================================================================
  
  - id: CUSTOM-DJANGO-SECRET
    name: Django Secret Key
    pattern: '(?i)(SECRET_KEY|DJANGO_SECRET_KEY)\s*[=:]\s*["\'][A-Za-z0-9!@#$%^&*()_+=-]{40,}["\']'
    severity: critical
    description: Detects hardcoded Django SECRET_KEY values
    suggestion: Use environment variables for Django secret keys
    file_patterns: ["*.py", "*.env*", "settings*.py"]
    keywords: ["SECRET_KEY"]
    confidence: 0.90

  - id: CUSTOM-FLASK-SECRET
    name: Flask Secret Key
    pattern: '(?i)app\.secret_key\s*=\s*["\'][^"\']{16,}["\']'
    severity: critical
    description: Detects hardcoded Flask secret key values
    suggestion: Use environment variables for Flask secret keys
    file_patterns: ["*.py"]
    keywords: ["secret_key"]
    confidence: 0.90

  - id: CUSTOM-RAILS-SECRET
    name: Rails Secret Key Base
    pattern: '(?i)secret_key_base[:\s]*["\'][A-Za-z0-9]{64,}["\']'
    severity: critical
    description: Detects hardcoded Rails secret_key_base values
    suggestion: Use Rails credentials or environment variables
    file_patterns: ["*.rb", "*.yml", "*.yaml"]
    keywords: ["secret_key_base"]
    confidence: 0.90

  - id: CUSTOM-LARAVEL-KEY
    name: Laravel App Key
    pattern: '(?i)APP_KEY\s*=\s*base64:[A-Za-z0-9+/=]{44}'
    severity: critical
    description: Detects hardcoded Laravel APP_KEY values
    suggestion: Use environment variables for Laravel app keys
    file_patterns: ["*.env*", "*.php"]
    keywords: ["APP_KEY"]
    confidence: 0.95

  # =========================================================================
  # API KEYS AND TOKENS
  # =========================================================================
  
  - id: CUSTOM-OPENAI-API-KEY
    name: OpenAI API Key
    pattern: 'sk-[A-Za-z0-9]{48}'
    severity: critical
    description: Detects OpenAI API keys
    suggestion: Use environment variables for AI service API keys
    keywords: ["sk-"]
    confidence: 0.95

  - id: CUSTOM-ANTHROPIC-API-KEY
    name: Anthropic API Key
    pattern: 'sk-ant-[A-Za-z0-9-_]{95}'
    severity: critical
    description: Detects Anthropic/Claude API keys
    suggestion: Use environment variables for AI service API keys
    keywords: ["sk-ant-"]
    confidence: 0.95

  - id: CUSTOM-SENDGRID-API-KEY
    name: SendGrid API Key
    pattern: 'SG\.[A-Za-z0-9-_]{22}\.[A-Za-z0-9-_]{43}'
    severity: high
    description: Detects SendGrid API keys
    suggestion: Use environment variables for email service API keys
    keywords: ["SG."]
    confidence: 0.95

  - id: CUSTOM-TWILIO-API-KEY
    name: Twilio API Key
    pattern: 'SK[0-9a-fA-F]{32}'
    severity: high
    description: Detects Twilio API keys
    suggestion: Use environment variables for Twilio credentials
    keywords: ["SK"]
    confidence: 0.90

  - id: CUSTOM-MAPBOX-TOKEN
    name: Mapbox Access Token
    pattern: 'pk\.eyJ1[A-Za-z0-9-_]{50,}'
    severity: medium
    description: Detects Mapbox access tokens
    suggestion: Use environment variables for map service tokens
    keywords: ["pk.eyJ"]
    confidence: 0.95

  # =========================================================================
  # INTERNAL PATTERNS
  # =========================================================================
  
  - id: CUSTOM-HARDCODED-PASSWORD
    name: Hardcoded Password Variable
    pattern: '(?i)(password|passwd|pwd|secret)\s*[=:]\s*["\'][^"\']{8,}["\']'
    severity: high
    description: Detects hardcoded password assignments
    suggestion: Use environment variables or secrets manager for passwords
    exclude_patterns: ["*test*", "*mock*", "*example*", "*fixture*"]
    keywords: ["password", "passwd", "pwd", "secret"]
    confidence: 0.75

  - id: CUSTOM-BEARER-TOKEN
    name: Bearer Token Header
    pattern: '(?i)Authorization["\']?\s*[=:]\s*["\']?Bearer\s+[A-Za-z0-9-_\.]{20,}'
    severity: high
    description: Detects hardcoded Bearer authentication tokens
    suggestion: Use secure token storage and dynamic token generation
    keywords: ["Bearer"]
    confidence: 0.85

  - id: CUSTOM-BASIC-AUTH
    name: Basic Auth Header
    pattern: '(?i)Authorization["\']?\s*[=:]\s*["\']?Basic\s+[A-Za-z0-9+/=]{16,}'
    severity: high
    description: Detects hardcoded Basic authentication credentials
    suggestion: Use secure credential storage instead of hardcoded auth
    keywords: ["Basic"]
    confidence: 0.85
