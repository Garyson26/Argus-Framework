# Custom Secret Detection Rules for Argus
#
# This file contains additional secret detection patterns beyond the default set.
# Add your organization-specific patterns here.
#
# Rule Format:
#   - id: Unique identifier (e.g., CUSTOM-001)
#   - name: Human-readable name
#   - pattern: Regex pattern (Python regex syntax)
#   - severity: critical, high, medium, low, info
#   - description: What this rule detects
#   - suggestion: Remediation advice
#   - file_patterns: List of glob patterns (optional, default: ["*"])
#   - exclude_patterns: List of glob patterns to exclude (optional)
#   - keywords: Pre-filter keywords for performance (optional)
#   - confidence: 0.0-1.0 (optional, default: 0.9)
#   - enabled: true/false (optional, default: true)

rules:
  # =========================================================================
  # CLOUD PROVIDER SECRETS
  # =========================================================================
  
  - id: CUSTOM-GCP-SERVICE-ACCOUNT
    name: GCP Service Account Key
    pattern: '(?i)("type"\s*:\s*"service_account"[^}]*"private_key"\s*:\s*"-----BEGIN'
    severity: critical
    description: Detects GCP service account JSON key files
    suggestion: Use Workload Identity Federation instead of service account keys
    file_patterns: ["*.json"]
    keywords: ["service_account", "private_key"]
    confidence: 0.95

  - id: CUSTOM-AZURE-CONNECTION-STRING
    name: Azure Storage Connection String
    pattern: 'DefaultEndpointsProtocol=https?;AccountName=[^;]+;AccountKey=[A-Za-z0-9+/=]{88}'
    severity: critical
    description: Detects Azure Storage connection strings with account keys
    suggestion: Use Azure AD authentication or managed identities instead
    keywords: ["DefaultEndpointsProtocol", "AccountKey"]
    confidence: 0.95

  - id: CUSTOM-AZURE-SAS-TOKEN
    name: Azure SAS Token
    pattern: '(?i)[?&]sig=[A-Za-z0-9%]{32,}'
    severity: high
    description: Detects Azure Shared Access Signature tokens in URLs
    suggestion: Use short-lived SAS tokens and rotate regularly
    keywords: ["sig="]
    confidence: 0.85

  # =========================================================================
  # DATABASE CREDENTIALS
  # =========================================================================
  
  - id: CUSTOM-MONGO-URI
    name: MongoDB Connection URI
    pattern: 'mongodb(\+srv)?://[^:]+:[^@]+@[^\s]+'
    severity: critical
    description: Detects MongoDB connection strings with embedded credentials
    suggestion: Use environment variables or secrets manager for database credentials
    keywords: ["mongodb://", "mongodb+srv://"]
    confidence: 0.95

  - id: CUSTOM-POSTGRES-URI
    name: PostgreSQL Connection URI
    pattern: 'postgres(ql)?://[^:]+:[^@]+@[^\s]+'
    severity: critical
    description: Detects PostgreSQL connection strings with embedded credentials
    suggestion: Use environment variables or secrets manager for database credentials
    keywords: ["postgres://", "postgresql://"]
    confidence: 0.95

