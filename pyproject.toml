[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-cloud"
version = "0.2.0"
description = "Automated Risk & Governance Unified Scanner - AWS Cloud Security Audit Tool"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "Argus Team" }
]
keywords = ["security", "aws", "cloud", "audit", "iac", "secrets", "iam"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    # CLI Framework
    "typer>=0.23.2",
    "rich>=15.0.0",
    
    # AWS SDK (capped by checkov, which pins boto3==1.35.49)
    "boto3>=1.35.49",
    "botocore>=1.35.49",
    
    # Database - PostgreSQL
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "alembic>=1.16.5",
    "psycopg2-binary>=2.9.12",
    
    # Database - Neo4j
    "neo4j>=5.28.5",
    
    # Task Queue
    "celery>=5.6.3",
    "redis>=7.0.1",
    
    # Configuration
    "pydantic>=2.13.5",
    "pydantic-settings>=2.11.0",
    
    # Git Operations
    "gitpython>=3.1.62",
    
