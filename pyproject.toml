[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fufufafa"
version = "0.1.0"
description = "Framework for Unified Flaw & Fault Auditing - AWS Cloud Security Audit Tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "FuFuFaFa Team" }
]
keywords = ["security", "aws", "cloud", "audit", "iac", "secrets", "iam"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    # CLI Framework
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    
    # AWS SDK
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    
    # Database - PostgreSQL
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    
    # Database - Neo4j
    "neo4j>=5.15.0",
    
    # Task Queue
    "celery>=5.3.0",
    "redis>=5.0.0",
    
    # Configuration
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Git Operations
    "gitpython>=3.1.0",
    
    # Secret Detection
    "python-magic>=0.4.27",
    
    # IaC Scanning (Checkov)
    "checkov>=3.0.0",
    
    # YAML/JSON Parsing
    "pyyaml>=6.0.0",
    
    # HTTP Requests
    "httpx>=0.26.0",
    
    # Async Support
    "anyio>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.12.0",
    "flake8>=7.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "moto>=5.0.0",  # AWS mocking
]

[project.scripts]
fufufafa = "src.main:app"

[project.urls]
Homepage = "https://github.com/Masriyan/FuFuFaFa"
Documentation = "https://github.com/Masriyan/FuFuFaFa#readme"
Repository = "https://github.com/Masriyan/FuFuFaFa"
Issues = "https://github.com/Masriyan/FuFuFaFa/issues"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src"]
skip = ["migrations", ".venv"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
